[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-cloak"
version = "0.1.0"
description = "Shrink a domain's public DNS surface so subdomain finders have nothing to resolve."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "oziitr" }]

[project.scripts]
dns-cloak = "dns_cloak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
